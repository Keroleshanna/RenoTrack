name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore RenoTrack.slnx

      - name: Build
        run: dotnet build RenoTrack.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test RenoTrack.slnx --no-build --configuration Release
